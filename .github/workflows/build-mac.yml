# Build ListenStudio.app (entry point app.py) on GitHub's Mac machines - no Mac of your own needed.
# After pushing to GitHub, open the repo's Actions page, pick "Build Mac app" -> Run workflow;
# when it finishes, download the zip from that run's Artifacts.
name: Build Mac app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15          # Apple chips (M1/M2/M3/M4)
          - runner: macos-15-intel    # Intel chips
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ListenStudio-${{ matrix.runner }}
          path: dist/ListenStudio-mac-*.zip
